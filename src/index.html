<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Study Room Reservation</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">Campus Services</p>
      <h1>Study Room Reservation</h1>
      <p>Submit and retrieve study-room reservation transactions.</p>
    </header>

    <section class="form-card" aria-labelledby="reservation-heading">
      <h2 id="reservation-heading">Reservation Details</h2>

      <form id="reservationForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input id="studentId" name="studentId" type="text" required>
          </div>

          <div class="form-group">
            <label for="room">Room</label>
            <select id="room" name="roomId" required>
              <option value="" selected disabled>Choose a room</option>
              <option value="StudyRoom1">Study Room 1</option>
              <option value="StudyRoom2">Study Room 2</option>
            </select>
          </div>

          <div class="form-group">
            <label for="reservationDate">Reservation Date</label>
            <input id="reservationDate" name="reservationDate" type="date" required>
          </div>

          <div class="form-group">
            <label for="startTime">Start Time</label>
            <input id="startTime" name="startTime" type="time" required>
          </div>

          <div class="form-group">
            <label for="endTime">End Time</label>
            <input id="endTime" name="endTime" type="time" required>
          </div>

          <div class="form-group">
            <label for="partySize">Number of Attendees</label>
            <input id="partySize" name="partySize" type="number" min="1" max="6" step="1" placeholder="Maximum 6" required>
            <p id="capacityMessage" class="capacity-message" aria-live="polite"></p>
          </div>
        </div>

        <button id="submitButton" type="submit">Request Reservation</button>
      </form>

      <div id="submissionResult" class="result-panel" aria-live="polite" hidden></div>
    </section>

    <section class="form-card lookup-card" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">Retrieve Saved Transaction</h2>
      <form id="lookupForm" class="lookup-form">
        <div class="form-group">
          <label for="lookupId">Confirmation / Reservation Number</label>
          <input id="lookupId" name="lookupId" type="text" placeholder="Example: RSV-..." required>
        </div>
        <button id="lookupButton" type="submit">Retrieve Reservation</button>
      </form>
      <div id="lookupResult" class="result-panel" aria-live="polite" hidden></div>
    </section>
  </main>
</body>
</html>
